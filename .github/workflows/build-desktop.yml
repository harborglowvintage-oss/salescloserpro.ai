# ─────────────────────────────────────────────────────────────
# SalesCloserPro — Build Desktop Apps (Windows, macOS, Linux)
# Triggered manually from the Actions tab or on version tags.
# ─────────────────────────────────────────────────────────────
name: 🖥️ Build Desktop App

on:
  # Manual trigger — click "Run workflow" in the Actions tab
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
          - linux

  # Auto-trigger on version tags (e.g. v1.0.0, v1.2.3)
  push:
    tags:
      - 'v*'

jobs:
  # ── Windows ──────────────────────────────────────────────
  build-windows:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platforms == 'all' ||
      github.event.inputs.platforms == 'windows'
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci
        env:
          NODE_ENV: development

      - name: 🏗️ Build Vite app
        run: npm run build

      - name: 🪟 Build Windows installer
        run: npx electron-builder --config electron-builder.json --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_HARD_LINKS: false

      - name: 📤 Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SalesCloserPro-Windows
          path: |
            release/*.exe
            release/*.msi
          retention-days: 30

  # ── macOS ────────────────────────────────────────────────
  build-macos:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platforms == 'all' ||
      github.event.inputs.platforms == 'macos'
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci
        env:
          NODE_ENV: development

      - name: 🏗️ Build Vite app
        run: npm run build

      - name: 🍎 Build macOS DMG
        run: npx electron-builder --config electron-builder.json --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_HARD_LINKS: false

      - name: 📤 Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SalesCloserPro-macOS
          path: release/*.dmg
          retention-days: 30

  # ── Linux ────────────────────────────────────────────────
  build-linux:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platforms == 'all' ||
      github.event.inputs.platforms == 'linux'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci
        env:
          NODE_ENV: development

      - name: 🏗️ Build Vite app
        run: npm run build

      - name: 🐧 Build Linux packages
        run: npx electron-builder --config electron-builder.json --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_HARD_LINKS: false

      - name: 📤 Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SalesCloserPro-Linux
          path: |
            release/*.AppImage
            release/*.deb
          retention-days: 30

  # ── Create GitHub Release (on tags only) ─────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
